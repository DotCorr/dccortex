apiVersion: v1
kind: Service
metadata:
  name: {{ include "dccortex.fullname" . }}-dashboard
  labels:
    {{- include "dccortex.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dccortex.fullname" . }}-platform-api
  labels:
    {{- include "dccortex.labels" . | nindent 4 }}
spec:
  type: {{ .Values.platformApi.service.type }}
  ports:
    - port: {{ .Values.platformApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: platform-api
    app.kubernetes.io/instance: {{ .Release.Name }}
