{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dccortex.fullname" . }}
  labels:
    {{- include "dccortex.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dccortex.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dccortex.fullname" . }}-platform-api
                port:
                  number: {{ .Values.platformApi.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
