services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dccortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dccortex_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dccortex_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dccortex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching / real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dashboard (No-Code Builder)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dccortex.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dccortex}:${POSTGRES_PASSWORD:-dccortex_dev}@postgres:5432/${POSTGRES_DB:-dccortex_dashboard}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - PLATFORM_API_URL=http://platform-api:3001
    ports:
      - "${DASHBOARD_PORT:-3002}:3000"
    volumes:
      - dashboard_uploads:/app/uploads
      - ./.skills:/app/.skills:ro
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_started
    restart: unless-stopped

  # Platform API — manages org containers + Tauri build jobs
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ARTIFACTS_DIR=/artifacts
    ports:
      - "${PLATFORM_API_PORT:-3001}:3001"
    volumes:
      # Expose host Docker socket so the server can spawn builder containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep /tmp shared with the host so nested docker builds can mount scaffold dirs.
      - /tmp:/tmp
      - platform_artifacts:/artifacts
    networks:
      - default
    restart: unless-stopped

  # DCRadio (focus radio) - static site served by nginx
  radio:
    build:
      context: ../DCRadio
      dockerfile: Dockerfile
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://radio.dccortex.com
    ports:
      - "${DCRADIO_PORT:-3010}:3000"
    networks:
      - default
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  dashboard_uploads:
  platform_artifacts:

networks:
  default:
    name: dccortex_default
